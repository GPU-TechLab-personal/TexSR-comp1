# The "upstream as published" baseline: BOTH defects left in place on purpose.
#
# Do not run this expecting a good model. Run it only if the writeup needs to
# separate "faithful reproduction of the DeepTextures repo" from "the DeepTextures
# repo has bugs" - which docs/OPEN-ITEMS.md #6 and #7 both say is the only way to
# tell those apart. Two things are deliberately wrong here:
#
#   pretrain_dir: null                  -> random init, like upstream's unresolvable
#                                          lookup produces in practice
#   lr_steps: [50000, ...] at niter 40k -> the decay never fires, LR is a constant
#                                          1e-4 for the whole run
#
# The trainer refuses a dead schedule unless --allow-dead-lr-schedule is passed, so
# using this config is an explicit act, not something you can drift into.
#
# If this baseline turns out weak, that weakness belongs to the CODE, not to the
# paper's method. Say so in those words.

# general setting
batch_size: 8           # upstream's value. 12 GB fits 16-24, but batch size is
                        # protocol-visible, so it is not raised silently.
input_size: 32
gt_size: 128
ch_size: 3
scale: 4
sub_name: 'esrgan_asconfigured'

pretrain_dir: null

checkpoint_root: '/workspace/runs/deeptex/checkpoints'
log_root: '/workspace/runs/deeptex/logs'

# generator setting
network_G:
    nf: 64
    nb: 23

# No network_D block: it is a DEAD KEY. Grep both repos - the discriminator is
# built as DiscriminatorVGG128(cfg['gt_size'], cfg['ch_size']) at
# train_esrgan.py:33, so nf comes from the Python default (models.py:114-115) and
# the donor's `network_D: {nf: 64}` never had any effect either.

# dataset setting
train_dataset:
    path: '/workspace/runs/deeptex/datasets/textures_db/textures_db_lrx4.tfrecord'
    using_bin: True
    using_flip: True
    using_rot: True
    # No num_samples: also a dead key in both repos. The real record count lives in
    # <tfrecord>.meta.json, where the trainer actually reads and verifies it.
val_dataset:
    hr_dir: '/workspace/runs/deeptex/datasets/textures_db/HR_val'
    lr_dir: '/workspace/runs/deeptex/datasets/textures_db/LRx4_val'

# training setting
niter: 40000

lr_G: !!float 1e-4
lr_D: !!float 1e-4
lr_steps: [50000, 100000, 200000, 300000]   # upstream's, verbatim - never fires at niter 40000
lr_rate: 0.5

adam_beta1_G: 0.9
adam_beta2_G: 0.99
adam_beta1_D: 0.9
adam_beta2_D: 0.99

w_pixel: !!float 1e-2
pixel_criterion: l1

w_feature: 1.0
feature_criterion: l1

w_gan: !!float 5e-3
gan_type: ragan

save_steps: 5000
