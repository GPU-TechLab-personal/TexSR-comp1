# Render-loss experiment, arm R0a: the GROUPED-DATA CONTROL, seed 1, w_render 0.
#
# Same recipe as esrgan_matsynth.yaml (the paper's losses, schedule and loss
# weights on MatSynth), trained by scripts/deeptex/deeptex_train.py in grouped
# mode: one TFRecord Example holds one material's five maps, each material gets
# one crop + one flip/rot shared by its five maps, and a step is 2 materials x 5
# maps = 10 images. w_render is 0, so the MatUp render loss is only MONITORED
# ([render] lines), never trained on. R0a and R1 share seed 1: identical G/D init
# and identical crop sequence, so R1 - R0a isolates the render term. R0b (seed 2)
# is the replicate whose distance to R0a is the run-to-run noise.
#
# EXACT DIFF against configs/deeptex/esrgan_matsynth.yaml, and only these:
#   batch_size             8 -> 2 (materials; 10 images per step)
#   seed                   added, 1
#   checkpoint_root        added, '/workspace/runs/deeptex/render_r0a/checkpoints'
#   log_root               added, '/workspace/runs/deeptex/render_r0a/logs'
#   train_dataset.path     .../matsynth/matsynth_all_lrx4.tfrecord ->
#                          .../matsynth_grouped/matsynth_grouped_lrx4.tfrecord
#   train_dataset.grouped  added, True
#   w_render               added, 0.0
#   render                 added, MatUp's renderer constants (block at the end)
# Every other value is esrgan_matsynth.yaml's. pretrain_name is kept but unused:
# deeptex_train.py reads pretrain_dir, and the stage passes --pretrain-dir none.
# Check it (comments stripped, so only the values above remain):
#   diff <(sed 's/[[:space:]]*#.*//' configs/deeptex/esrgan_matsynth.yaml | grep -v '^$') \
#        <(sed 's/[[:space:]]*#.*//' configs/deeptex/esrgan_matsynth_render_r0a.yaml | grep -v '^$')
#
# Run:
#   scripts\deeptex\run_deeptex.ps1 -Stage render-train -Arm r0a -KeepAllCheckpoints
# which runs deeptex_train.py --stage esrgan --losses upstream --shuffle off
#   --allow-dead-lr-schedule --pretrain-dir none --no-val --log-every 100
#   --render-monitor-every 100
# (upstream's loss functions, unshuffled record stream, dead LR schedule and
# from-scratch init, as the matsynth_all paper run had them). sub_name stays
# 'esrgan_40k'; the arms are kept apart by checkpoint_root.

# general setting
batch_size: 2               # CHANGED from 8: materials per step, x 5 maps = 10 images
input_size: 32
gt_size: 128
ch_size: 3
scale: 4
sub_name: 'esrgan_40k'
pretrain_name: './checkpoints/'

# ADDED: tf.keras.utils.set_random_seed before the model build (G/D init) and keys the
# stateless crop/flip/rot draws. R0a and R1 share 1; R0b uses 2.
seed: 1

# ADDED: this arm's own roots; checkpoints land in <checkpoint_root>/<sub_name>.
checkpoint_root: '/workspace/runs/deeptex/render_r0a/checkpoints'
log_root: '/workspace/runs/deeptex/render_r0a/logs'

# generator setting
network_G:
    nf: 64
    nb: 23

# dataset setting
train_dataset:
    # CHANGED: the grouped record (run_deeptex.ps1 -Stage prep-grouped).
    path: '/workspace/runs/deeptex/datasets/matsynth_grouped/matsynth_grouped_lrx4.tfrecord'
    grouped: True           # ADDED: selects deeptex_train.py's grouped step
    using_bin: True
    using_flip: True
    using_rot: True

# training setting
niter: 40000

lr_G: !!float 1e-4
lr_D: !!float 1e-4
lr_steps: [50000, 100000, 200000, 300000]
lr_rate: 0.5

adam_beta1_G: 0.9
adam_beta2_G: 0.99
adam_beta1_D: 0.9
adam_beta2_D: 0.99

w_pixel: !!float 1e-2
pixel_criterion: l1

w_feature: 1.0
feature_criterion: l1

w_gan: !!float 5e-3
gan_type: ragan

save_steps: 5000

# ADDED: render-space loss, scripts/deeptex/render_tf.py (a port of MatUp's
# renderer). 0.0 = monitor only: the [render] l21 is printed, nothing trains on it.
w_render: !!float 0.0
render:
    n_lights: 100                       # matup_egsr/main_optim.py:122 --nb_lights
    light_radius: !!float 1.4           # matup_egsr/main_optim.py:87  1.4 * fib
    intensity: !!float 8.0              # matup/renderer.py:14
    disp_val: !!float 0.01              # matup/dataLoader.py:154
    min_roughness: !!float 0.045        # matup/renderer.py:15, dataLoader.py:39
    min_alpha: !!float 2.0e-3           # matup/renderer.py:16
    nz_min: !!float 1.0e-3              # ours: n_z guard (branchlessONB 0/0 at n_z = 0)
    mask_min_norm: !!float 0.1          # ours: GT texels with |2v-1| < 0.1 are masked
    normal_norm_floor: !!float 1.0e-4   # ours: floor on |2v-1|^2 before normalising
    light_chunks: 1                     # 4 = recompute_grad memory fallback (same value)
