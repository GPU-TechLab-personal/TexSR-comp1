# general setting
batch_size: 8
input_size: 32
gt_size: 128
ch_size: 3
scale: 4
sub_name: 'esrgan_40k'
pretrain_name: './checkpoints/'

# generator setting
network_G:
    nf: 64
    nb: 23

# dataset setting
train_dataset:
    path: '/workspace/runs/deeptex/datasets/matsynth/matsynth_chratio_lrx4.tfrecord'
    using_bin: True
    using_flip: True
    using_rot: True

# training setting
niter: 40000

lr_G: !!float 1e-4
lr_D: !!float 1e-4
lr_steps: [50000, 100000, 200000, 300000]
lr_rate: 0.5

adam_beta1_G: 0.9
adam_beta2_G: 0.99
adam_beta1_D: 0.9
