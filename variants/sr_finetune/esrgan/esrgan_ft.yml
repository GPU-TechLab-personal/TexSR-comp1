# ESRGAN fine-tuned on MatSynth - external/BasicSR/options/train/ESRGAN/train_ESRGAN_x4.yml
# (BasicSR v1.4.2 @ 651835a) with ONLY the lines marked CHANGED / REMOVED altered;
# every other value is the official one. Trained by variants/sr_finetune/esrgan/train.py
# (run.ps1 -Stage train -Arm esrgan), root /workspace/runs/sr_ft/basicsr, so the
# checkpoints land in runs/sr_ft/basicsr/experiments/esrgan_ft/models/net_g_<N>.pth
# (variants/arms.json checkpoint_root).

# general settings
name: esrgan_ft                       # CHANGED (was 052_ESRGAN_x4_f64b23_DIV2K_400k_B16G1_051pretrain_wandb)
model_type: ESRGANModel
scale: 4
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: MatSynth_5maps              # CHANGED (was DIV2K)
    type: PairedImageDataset
    # CHANGED: the 14,520 MatSynth pairs, five maps 1:1 (sr_finetune/prep_pairs.py).
    # LR is area-decimated, not bicubic like DIV2K's X4 - the evaluation LR is area.
    dataroot_gt: /workspace/runs/sr_ft/pairs/HR
    dataroot_lq: /workspace/runs/sr_ft/pairs/LRx4
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 6
    batch_size_per_gpu: 16            # official; gate throughput confirms it fits 12 GB
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  # REMOVED: val (Set14). No validation during training; the arms are scored
  # afterwards on the 12 evaluation materials (run.ps1 -Stage infer / eval).

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23

network_d:
  type: VGGStyleDiscriminator
  num_in_ch: 3
  num_feat: 64

# path
path:
  # CHANGED: start from the released ESRGAN generator (was the authors' own PSNR
  # model, net_g_1000000.pth). Its file has only 'params'; net_g_ema falls back
  # to it (basicsr/models/base_model.py:292-294). D has no pretrain: scratch.
  pretrain_network_g: /workspace/runs/sr_ft/weights/ESRGAN_SRx4_DF2KOST_official-ff704c30.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 30000]        # CHANGED (was [50000, 100000, 200000, 300000])
    gamma: 0.5

  total_iter: 40000                   # CHANGED (was 400000)
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: !!float 1e-2
    reduction: mean
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1  # before relu
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 1.0
    style_weight: 0
    criterion: l1
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 5e-3

  net_d_iters: 1
  net_d_init_iters: 0

# REMOVED: val settings (no validation set, see datasets above).

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
